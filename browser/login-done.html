<!doctype html>
<!--
  Where a service sends the Student back after they say yes on its login page. The address holds a code, and Buddy's backend
  reads that from the tab after the Student taps Done. This page has no script and loads nothing, so nothing else sees the code.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Finished logging in</title>
    <style>
      body { font: 18px/1.5 sans-serif; margin: 2rem; color: #222; }
    </style>
  </head>
  <body>
    <h1>You've finished logging in</h1>
    <p>Tap Done in the Buddy app so that Buddy can start reading.</p>
  </body>
</html>
