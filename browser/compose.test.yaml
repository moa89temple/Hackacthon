# Added on top of compose.yaml for the container checks, under its own project name, so they
# use a separate profile and can never touch the Student's real logins.
services:
  browser:
    volumes:
      - ./test-pages:/test-pages:ro
    # A name that looks public, for checks of what a page may load from an address nobody listed.
    extra_hosts:
      - "cdn.elsewhere.test:127.0.0.1"
